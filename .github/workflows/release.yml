# The single entry point for every publish of @pendle/boros-mcp.
#
# ── Why one file ─────────────────────────────────────────────────────────────
# npm permits ONE trusted publisher for each package - "Each package can only
# have one trusted publisher configured at a time" - and it matches the
# ENTRY-POINT workflow filename, not the workflow that runs the publish command.
#
# The snapshot path used to live in snapshot-release.yml and
# comment-snapshot-release.yml, which are two more entry points that the single
# record cannot cover. They were disabled as .bak files rather than fixed, so
# /snapshot-release did nothing at all on this repo. Both are deleted here and
# their jobs rebuilt below, on the design proven across the four SDK repos.
#
# Both modes are jobs in THIS file rather than reusable workflows on purpose. A
# reusable workflow makes workflow_ref and job_workflow_ref disagree, and npm
# documents that it reads the caller. Keeping them equal removes the question.
#
# ── Adding a trigger ─────────────────────────────────────────────────────────
# Any new publish path must be a job here. A new workflow file that publishes
# will fail the OIDC exchange, because the record names this filename.
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions: {}

# Concurrency is per JOB, not per workflow. A workflow-level group would make a
# snapshot dispatch queue behind a production release on the same ref, and the
# two have opposite cancellation semantics: a superseded snapshot is worth
# cancelling, a half-finished production release never is.

jobs:
  # ── Snapshot gate, comment path only ───────────────────────────────────────
  # Nothing downstream runs until this job proves the commenter holds write.
  # `issue_comment` fires for anyone who can see the PR, and the snapshot job
  # can publish, so identity has to be established here.
  authorize:
    if: >-
      github.event_name == 'issue_comment' &&
      github.repository == 'pendle-finance/boros-mcp' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/snapshot-release')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      # `pull-requests: write`, not `read`. The Acknowledge step below reacts to a
      # comment that lives on a PULL REQUEST, and GitHub governs writes to a PR's
      # comment thread with the `pull-requests` scope - `issues: write` is not
      # enough and the call 403s with `Resource not accessible by integration`.
      pull-requests: write
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      branch_name: ${{ steps.resolve.outputs.branch_name }}
    steps:
      # Replaces the old author_association check, which was NOT sufficient:
      # COLLABORATOR includes read-only collaborators, who can comment but must
      # not be able to publish. Ask the API what the permission actually is.
      - name: Require write access
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const actor = context.payload.comment.user.login;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor,
            });
            if (!['admin', 'write'].includes(data.permission)) {
              core.setFailed(`${actor} has '${data.permission}' on this repo - needs write.`);
            }

      # Pin the exact SHA here, in the gate. This replaces
      # xt0rted/pull-request-comment-branch, an UNPINNED third-party action that
      # used to decide what got published, and it passed a branch name rather
      # than a SHA - so the ref could be re-read after authorisation and the code
      # swapped between the check and the build.
      - name: Resolve head SHA
        id: resolve
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            core.setOutput('sha', pr.data.head.sha);
            core.setOutput('branch_name', pr.data.head.ref);

      - name: Acknowledge
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: '+1',
            });

  # ── Production, push to main ───────────────────────────────────────────────
  production:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'pendle-finance/boros-mcp'
    concurrency:
      group: release-production-${{ github.ref }}
      cancel-in-progress: false
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Only actions/checkout uses this token, and only to read. The release
      # commit, the tag and the version PR all go through the App token below.
      contents: read
      id-token: write # mints the OIDC token for npm trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      # Deliberately no `registry-url`. Setting it makes setup-node write an
      # .npmrc holding _authToken=${NODE_AUTH_TOKEN}, which with no token in the
      # environment resolves to the literal placeholder XXXXX-XXXXX-XXXXX-XXXXX.
      # npm then sends that on every registry read and `npm info` fails.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Pinned to 11.x ON PURPOSE - do not change to npm@latest. Trusted
      # publishing needs npm >= 11.5.1, but npm@latest is now 12.x, and npm 12
      # changed `npm info --json` to return an ARRAY where 11 returned an
      # object. changesets reads `.versions` off it, gets undefined, concludes
      # the current version was never published, and republishes over it.
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install
        run: yarn install --immutable

      - name: Prepare pull request message
        # `changeset status` exits 1 on "packages have been changed but no
        # changesets were found", a normal state on main after a changeset-less
        # merge, which under `bash -e` would kill the job. `// empty` also stops
        # `.releases[0]` yielding the string "null" and logging `Releasing vnull`.
        run: |
          yarn changeset status --output=release.json || true
          if [ -f release.json ]; then
            echo "NEW_VERSION=$(jq -r '.releases[0].newVersion // empty' release.json)" >> $GITHUB_ENV
            rm release.json
          fi

      - name: Mint release-bot token
        id: release-token
        # GITHUB_TOKEN cannot open a pull request in this org: the setting
        # `can_approve_pull_request_reviews = false` blocks CREATE as well as
        # approve. Re-enabling it is not the fix - it would let a bot satisfy
        # the required-approval rule on main. An App token is.
        #
        # NO `owner:` - that scopes the token to THIS repo alone rather than
        # every repo the App is installed on.
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: 4697663 # pendle-npm-release-bot
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write # createCommitOnBranch + the release tag
          permission-pull-requests: write # the version PR

      - name: Create release pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          title: "Releasing v${{ env.NEW_VERSION }}"
          commit: "v${{ env.NEW_VERSION }}"
          commitMode: github-api # push commits/tags via the API so they are signed (Verified)
          # No NPM_TOKEN anywhere, on purpose. `changeset publish` shells out to
          # the npm CLI, which performs the OIDC exchange and is matched by npm
          # against the trusted-publisher record for this repo + this workflow
          # filename + the npm-production environment. A token here would be
          # silently preferred over OIDC.
          #
          # No version gate either, unlike the three SDK repos. Those needed one
          # because their packages are RESTRICTED, so an unauthenticated
          # `npm info` 404s and changesets reads every version as unpublished.
          # @pendle/boros-mcp is PUBLIC, so that lookup is correct and a
          # changeset-less merge skips cleanly on its own.
          publish: yarn changeset publish
          github-token: ${{ steps.release-token.outputs.token }}
        env:
          GITHUB_TOKEN: ${{ steps.release-token.outputs.token }}

      # This repo is PUBLIC, so npm accepts a provenance bundle - the only one
      # of the five where that is true. Publishing without an attestation must
      # therefore fail the job rather than pass quietly.
      - name: Verify provenance
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="$(jq -r '.version' package.json)"
          echo "checking provenance for @pendle/boros-mcp@${VERSION}"
          for attempt in 1 2 3 4 5 6; do
            ATT="$(curl -sf "https://registry.npmjs.org/@pendle/boros-mcp" \
                   | jq -r --arg v "$VERSION" '.versions[$v].dist.attestations // "absent"')"
            if [ "$ATT" != "absent" ] && [ "$ATT" != "null" ]; then
              echo "provenance attestation present"
              exit 0
            fi
            echo "attempt ${attempt}: not visible yet, waiting for registry propagation"
            sleep 10
          done
          echo "::error::published ${VERSION} with no provenance attestation"
          exit 1

  # ── Snapshot, manual dispatch or an authorised /snapshot-release comment ────
  snapshot:
    needs: [authorize]
    # `!cancelled()` rather than `success()`. On workflow_dispatch the authorize
    # job is skipped by its own `if`, and a skipped dependency skips every job
    # that needs it unless the condition tolerates it. The comment path still
    # demands that authorize actually passed.
    if: >-
      !cancelled() &&
      github.repository == 'pendle-finance/boros-mcp' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issue_comment' && needs.authorize.result == 'success'))
    concurrency:
      group: release-snapshot-${{ needs.authorize.outputs.sha || github.sha }}
      cancel-in-progress: true
    # Same environment as production, because npm's single trusted-publisher
    # record names it. See the header.
    environment: npm-production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # mints the OIDC token for npm trusted publishing
    outputs:
      package_version: ${{ steps.changeset_prepare.outputs.package_version }}
    env:
      # On the comment path these come from the gate above, which pinned them
      # before this job started. On workflow_dispatch there is no gate and the
      # dispatched ref is the source of truth.
      REF: ${{ needs.authorize.outputs.sha || github.sha }}
      BRANCH_NAME: ${{ needs.authorize.outputs.branch_name || github.ref_name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.REF }}

      # No `registry-url`, for the same reason as the production job: it writes
      # an .npmrc holding a token placeholder, and there is no token here. The
      # old snapshot-release.yml.bak set it because it authenticated with
      # NPM_PUBLISH_TOKEN, a secret that no longer exists.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # See the production job for why this is pinned to the 11.x line.
      - name: Install npm 11
        run: npm install -g npm@11

      - name: Install
        run: yarn install --immutable

      - name: Prepare changeset snapshot version (part after the last slash)
        id: changeset_prepare
        run: |
          yarn changeset version --snapshot "${BRANCH_NAME##*/}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          echo "$PACKAGE_VERSION"
          echo "package_version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      # `--tag snapshot`, not `nightly`. The four SDK repos use `nightly`, but
      # this package already carries a published `snapshot` dist-tag and renaming
      # it would strand any consumer pinned to it.
      #
      # Without a tag npm defaults to `latest`, and a snapshot built from a
      # feature branch would become what every unpinned consumer installs.
      #
      # No NPM_TOKEN. npm mints the credential from `id-token: write` above,
      # exactly as the production job does.
      - name: Create snapshot release
        run: yarn changeset publish --tag snapshot

      # This repo is PUBLIC, so npm accepts a provenance bundle, and
      # publishConfig.provenance is true - so a snapshot gets an attestation just
      # as a production release does. Verify it rather than assume it.
      - name: Verify provenance
        run: |
          VERSION="${{ steps.changeset_prepare.outputs.package_version }}"
          echo "checking provenance for @pendle/boros-mcp@${VERSION}"
          for attempt in 1 2 3 4 5 6; do
            ATT="$(curl -sf "https://registry.npmjs.org/@pendle/boros-mcp" \
                   | jq -r --arg v "$VERSION" '.versions[$v].dist.attestations // "absent"')"
            if [ "$ATT" != "absent" ] && [ "$ATT" != "null" ]; then
              echo "provenance attestation present"
              exit 0
            fi
            echo "attempt ${attempt}: not visible yet, waiting for registry propagation"
            sleep 10
          done
          echo "::error::published ${VERSION} with no provenance attestation"
          exit 1

  notify-done:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [authorize, snapshot]
    if: ${{ github.event_name == 'issue_comment' && needs.snapshot.result == 'success' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          package_version: ${{ needs.snapshot.outputs.package_version }}
          sha: ${{ needs.authorize.outputs.sha }}
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Snapshot released from `' + process.env.sha.slice(0, 7) +
                    '` under the `snapshot` tag:\n```\n' + process.env.package_version + '\n```',
            });

  notify-done-fail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [authorize, snapshot]
    if: ${{ failure() && github.event_name == 'issue_comment' }}
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'Snapshot release failed. Check the workflow run for details.',
            });
