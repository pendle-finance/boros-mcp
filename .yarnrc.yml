nodeLinker: node-modules

enableGlobalCache: false

npmMinimalAgeGate: 14d

npmPublishAccess: public

npmRegistryServer: "https://registry.npmjs.org/"

# No npmAlwaysAuth / npmAuthToken. Publishing goes through trusted publishing,
# so yarn never needs a publish credential, and this package has NO @pendle
# dependencies, so nothing needs a read one either. Yarn resolves "${VAR}" at
# CONFIG LOAD and THROWS on an unset variable, so leaving the old line would
# break `yarn install` the moment the token stopped being set.
npmScopes:
  pendle:
    npmPublishRegistry: "https://registry.npmjs.org/"
    npmRegistryServer: "https://registry.npmjs.org/"

unsafeHttpWhitelist:
  - registry.npmjs.org

yarnPath: .yarn/releases/yarn-4.13.0.cjs
